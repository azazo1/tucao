org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# 任务输出写进本地构建缓存, gradle/actions 会把 caches/build-cache-1 一起存进 actions cache,
# 因此 ci 上可以直接命中上一轮算过的 Kotlin 编译, 资源处理和 dex 等任务.
# 配置缓存暂不开: Flutter 3.47.7 的 gradle 插件在 doLast 里捕获 Variant/Project,
# 存配置缓存时必然失败 (flutter/flutter#189726), 等上游修好再打开.
org.gradle.caching=true
# ci 构建使用的 NDK 版本, 与 GitHub Actions ubuntu 镜像预装版本对齐, 见 build.gradle.kts 里的说明.
tucao.ndkVersion=27.3.13750724
