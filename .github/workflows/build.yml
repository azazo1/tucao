name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已有 tag, 留空时不创建 release"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: 解析版本
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.release_context.outputs.is_release }}
      tag_name: ${{ steps.release_context.outputs.tag_name }}
      source_ref: ${{ steps.release_context.outputs.source_ref }}
      version: ${{ steps.release_version.outputs.version }}
      build_version: ${{ steps.build_version.outputs.build_version }}
    steps:
      - name: 解析发布上下文
        id: release_context
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_REF: ${{ github.ref }}
          CURRENT_REF_NAME: ${{ github.ref_name }}
          CURRENT_SHA: ${{ github.sha }}
          DISPATCH_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          is_release=false
          tag_name=""
          source_ref="$CURRENT_SHA"

          if [[ "$EVENT_NAME" == "push" && "$CURRENT_REF" == refs/tags/* ]]; then
            is_release=true
            tag_name="$CURRENT_REF_NAME"
            source_ref="$CURRENT_REF"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$DISPATCH_TAG" ]]; then
            git check-ref-format "refs/tags/$DISPATCH_TAG"
            is_release=true
            tag_name="$DISPATCH_TAG"
            source_ref="refs/tags/$DISPATCH_TAG"
          fi

          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

      - name: 检出目标提交
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release_context.outputs.source_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: 准备 uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: 校验发布版本
        id: release_version
        if: steps.release_context.outputs.is_release == 'true'
        env:
          TAG_NAME: ${{ steps.release_context.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          # 版本来源是 git tag, 这里校验 tag 与 pubspec 的包版本一致.
          package_version="$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')"
          tag_version="${TAG_NAME#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "tag $TAG_NAME 与 pubspec 版本 $package_version 不一致" >&2
            exit 1
          fi

          notes="docs/changelog/$tag_version.md"
          if [[ ! -s "$notes" ]]; then
            echo "缺少 release notes: $notes" >&2
            exit 1
          fi

          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: 解析构建版本
        id: build_version
        env:
          IS_RELEASE: ${{ steps.release_context.outputs.is_release }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$IS_RELEASE" == "true" ]]; then
            echo "build_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 仓库还没有版本 tag 时用 pubspec 的包版本兜底.
          package_version="$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')"
          build_version="$(PROJECT_PACKAGE_VERSION="$package_version" \
            uv run --no-project python scripts/build-version.py)"
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"

  analyze:
    name: 静态检查
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: 检出目标提交
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.source_ref }}

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 显式指定版本: flutter-version-file 读的是 pubspec 的 environment.flutter,
          # 那里写的是范围约束, 该 action 无法解析范围.
          flutter-version: 3.47.7
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze --no-fatal-infos

  test:
    name: 单元测试
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: 检出目标提交
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.source_ref }}

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 显式指定版本: flutter-version-file 读的是 pubspec 的 environment.flutter,
          # 那里写的是范围约束, 该 action 无法解析范围.
          flutter-version: 3.47.7
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 运行测试
        run: flutter test

  android:
    name: 构建 Android
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64-v8a
          - arch: armeabi-v7a
          - arch: x86_64
    steps:
      - name: 检出目标提交
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: 准备 uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: 构建 Java 环境
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          # 取值是 never / always / on-success, 不是布尔值.
          cache-cleanup: always
          add-job-summary: on-failure

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 显式指定版本: flutter-version-file 读的是 pubspec 的 environment.flutter,
          # 那里写的是范围约束, 该 action 无法解析范围.
          flutter-version: 3.47.7
          cache: true

      # media_kit 会在构建时从 GitHub Release 下载 libmpv 原生库到 build 目录,
      # 单次约 100MB, 而 build 目录不随仓库或 Gradle 缓存保留, 因此单独缓存.
      # 缓存只是加速手段, 缺失时构建脚本会自行重新下载.
      - name: 恢复 libmpv 原生库缓存
        uses: actions/cache@v4
        with:
          path: build/media_kit_libs_android_video
          key: ${{ runner.os }}-libmpv-${{ matrix.arch }}-v1.1.7
          restore-keys: |
            ${{ runner.os }}-libmpv-${{ matrix.arch }}-

      - name: 写入签名密钥
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ secrets.SIGN_KEYSTORE_BASE64 }}" ]]; then
            echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks
            {
              echo "storeFile=key.jks"
              echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.KEY_ALIAS }}"
              echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            } > android/key.properties
          fi

      - name: 获取依赖
        run: flutter pub get

      - name: 构建并打包
        env:
          PROJECT_BUILD_VERSION: v${{ needs.version.outputs.build_version }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: uv run --no-project python scripts/dist.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: tucao-${{ needs.version.outputs.build_version }}-android-${{ matrix.arch }}
          path: dist/tucao-*-android-${{ matrix.arch }}.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 Release
    if: needs.version.outputs.is_release == 'true'
    needs: [version, analyze, test, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出发布 tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: 重新获取 annotated tag object
        env:
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$TAG_NAME"
          git fetch --force origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"

      - name: 校验 tag annotation
        env:
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$TAG_NAME"
          manual_notes="docs/changelog/$VERSION.md"

          if [[ ! -s "$manual_notes" ]]; then
            echo "缺少 release notes: $manual_notes" >&2
            exit 1
          fi

          tag_type="$(git cat-file -t "$tag_ref")"
          if [[ "$tag_type" != "tag" ]]; then
            echo "发布 tag 必须是 annotated tag: $TAG_NAME" >&2
            exit 1
          fi

          git cat-file tag "$tag_ref" | sed '1,/^$/d' > tag-notes.md
          if ! grep -q '[^[:space:]]' tag-notes.md; then
            echo "发布 tag 的 annotation 不能为空: $TAG_NAME" >&2
            exit 1
          fi

          if ! cmp -s "$manual_notes" tag-notes.md; then
            echo "发布 tag 的 annotation 与 $manual_notes 不一致" >&2
            diff -u "$manual_notes" tag-notes.md || true
            exit 1
          fi

      - name: 生成 release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          manual_notes="docs/changelog/$VERSION.md"
          base_tag_file="docs/changelog/$VERSION-base.txt"
          api_args=(
            --method POST
            "repos/$GITHUB_REPOSITORY/releases/generate-notes"
            -f "tag_name=$TAG_NAME"
          )

          api_args+=(-f "target_commitish=$(git rev-parse HEAD)")

          if [[ -s "$base_tag_file" ]]; then
            base_tag="$(<"$base_tag_file")"
            git check-ref-format "refs/tags/$base_tag"
            api_args+=(-f "previous_tag_name=$base_tag")
          fi

          gh api "${api_args[@]}" --jq '.body' > generated-notes.md
          cp "$manual_notes" release-notes.md

          if [[ -s generated-notes.md ]]; then
            printf '\n---\n\n' >> release-notes.md
            cat generated-notes.md >> release-notes.md
          fi

      - name: 下载构建产物
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts
          merge-multiple: true

      - name: 生成校验和
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd release-artifacts
          archives=(tucao-*.apk)

          if (( ${#archives[@]} != 3 )); then
            echo "预期 3 个 apk, 实际找到 ${#archives[@]} 个" >&2
            exit 1
          fi

          sha256sum "${archives[@]}" > SHA256SUMS

      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            release-artifacts/tucao-*.apk
            release-artifacts/SHA256SUMS
          )

          if (( ${#assets[@]} != 4 )); then
            echo "预期 4 个发布文件, 实际找到 ${#assets[@]} 个" >&2
            exit 1
          fi

          prerelease_args=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --verify-tag \
              --title "吐槽 v$VERSION" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" \
              --verify-tag \
              --title "吐槽 v$VERSION" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
          fi

  # 每次 push 都把同一个滚动 tag 的预发布 release 重建成最新产物,
  # 因此仓库里始终只有最新一次 push 的预发布.
  prerelease:
    name: 发布预发布 Release
    needs: [version, analyze, test, android]
    # tag push 走上面的正式 release; pull_request 的 token 是只读的, 也不该改写预发布.
    if: needs.version.outputs.is_release != 'true' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # gh release 靠本地 git 远端推断仓库, 而这个 job 不检出代码, 所以直接指定仓库.
      GH_REPO: ${{ github.repository }}
    # 所有分支共用同一个滚动 release, 必须串行: 正在发布的那次跑完,
    # 队列里只留下最后排上的一个, 更早的待跑项会被取消.
    concurrency:
      group: rolling-prerelease
      cancel-in-progress: false
    steps:
      # 构建快慢不定, 先跑的 push 不一定先到这里, 因此发布前确认自己仍是最新提交,
      # 免得较早的 push 覆盖掉较新的预发布.
      - name: 确认提交仍是最新
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # 用 commit 查"以它为 HEAD 的分支", 免得把分支名拼进 url.
          head_branches="$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT/branches-where-head" --jq '.[].name')"

          is_latest=false
          if grep -Fxq "$BRANCH" <<< "$head_branches"; then
            is_latest=true
          else
            echo "::notice::$BRANCH 的 HEAD 已不在 $COMMIT, 本次预发布让给更新的运行"
          fi
          echo "is_latest=$is_latest" >> "$GITHUB_OUTPUT"

      - name: 下载构建产物
        if: steps.freshness.outputs.is_latest == 'true'
        uses: actions/download-artifact@v5
        with:
          path: prerelease-artifacts
          merge-multiple: true

      - name: 生成校验和
        if: steps.freshness.outputs.is_latest == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd prerelease-artifacts
          archives=(tucao-*.apk)

          if (( ${#archives[@]} != 3 )); then
            echo "预期 3 个 apk, 实际找到 ${#archives[@]} 个" >&2
            exit 1
          fi

          sha256sum "${archives[@]}" > SHA256SUMS

      - name: 重建预发布 Release
        if: steps.freshness.outputs.is_latest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          BUILD_VERSION: ${{ needs.version.outputs.build_version }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag="dev-latest"
          assets=(
            prerelease-artifacts/tucao-*.apk
            prerelease-artifacts/SHA256SUMS
          )

          if (( ${#assets[@]} != 4 )); then
            echo "预期 4 个发布文件, 实际找到 ${#assets[@]} 个" >&2
            exit 1
          fi

          # 先清掉上一轮的 release 与 tag 再按本次提交重建, 于是滚动 tag 总是指向
          # 最新一次 push 的提交, 产物也不会残留上一轮的 apk.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag
          fi
          # tag 还在但 release 已被删掉时, 沿用旧 tag 建 release 会指到旧提交, 这里补齐.
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" >/dev/null 2>&1 || true

          {
            echo "分支 \`$BRANCH\` 最新一次 push 的预发布, 会被后续 push 覆盖, 只保留最新的一次."
            echo
            echo "- 提交: [\`${COMMIT:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${COMMIT})"
            echo "- 构建版本: \`v$BUILD_VERSION\`"
            echo
            echo "按设备架构下载对应的 \`tucao-*.apk\`, 校验和见 \`SHA256SUMS\`."
          } > prerelease-notes.md

          gh release create "$tag" "${assets[@]}" \
            --target "$COMMIT" \
            --title "吐槽 最新构建 v$BUILD_VERSION" \
            --notes-file prerelease-notes.md \
            --prerelease \
            --latest=false
